    --gold: #a8813a;
    --gold-deep: #7c5e28;
    --line: #ded2b8;

  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    background: var(--bg);
    background-image:

    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
  }

  .app-shell {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header.app-header {
    padding: 18px 4px 14px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .app-number {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--gold-deep);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 2px 9px;
    letter-spacing: 0.03em;
  }

  .app-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--ink);
  }

  .backlink {
    font-size: 13px;
    color: var(--gold-deep);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .backlink:hover, .backlink:focus {
    border-bottom-color: var(--gold-deep);
  }

  main {
    flex: 1;
    padding: 18px 4px 24px 4px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .tabs {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    box-shadow: var(--shadow);
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 12px;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tab-btn.active {
    background: var(--gold-deep);
    color: #fff8ec;
  }

  .view { display: none; flex-direction: column; gap: 16px; }
  .view.active { display: flex; }

  .today-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 22px;
    position: relative;
    overflow: hidden;
  }

  .today-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--gold), var(--gold-deep));
  }

  .today-date {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .cat-pill {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
    margin-bottom: 14px;
  }

  .cat-liturgy { background: var(--accent-liturgy); }
  .cat-law { background: var(--accent-law); }
  .cat-philosophy { background: var(--accent-philosophy); }
  .cat-motto { background: var(--accent-motto); }

  .latin-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 8px 0;
  }

  .translation-text {
    font-size: 17px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 14px 0;
  }

  .pronunciation-row {
    font-size: 14px;
    color: var(--gold-deep);
    margin-bottom: 14px;
  }

  .pronunciation-row .label {
    font-weight: 600;
    color: var(--ink-soft);
    margin-right: 4px;
  }

    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin: 0;
  }

    justify-content: flex-end;
    margin-top: 16px;
  }

    color: var(--gold-deep);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;

  .fav-btn .star { font-size: 16px; line-height: 1; }

  .fav-btn.active {
    background: var(--gold-deep);
    color: #fff8ec;
  }

  .archive-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .filter-chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--bg-card);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }

  .filter-chip.active {
    background: var(--ink);
    color: #fff8ec;
    border-color: var(--ink);
  }

  .page-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px;
    box-shadow: var(--shadow);
  }

    border: none;
    background: var(--ink);
    color: #fff8ec;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

    background: var(--line);
    color: #9a8f78;
    cursor: not-allowed;
  }

  .page-nav .page-label {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .archive-entry {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .archive-entry-head {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }

    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }

  .archive-entry-head .chev {
    font-size: 14px;
    color: var(--ink-soft);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .archive-entry.open .chev { transform: rotate(180deg); }

  .archive-entry-body {
    display: none;
    padding: 0 16px 16px 16px;
  }

  .archive-entry.open .archive-entry-body { display: block; }

  .archive-entry-body .translation-text { margin-bottom: 10px; }
  .archive-entry-body .pronunciation-row { margin-bottom: 10px; }
  .archive-entry-body .usage-text { border-top: none; padding-top: 0; }

  .empty-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 24px 10px;
  }

  footer.app-footer {
    padding: 16px 4px 22px 4px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
  }

  footer.app-footer a {
    color: var(--gold-deep);
    text-decoration: none;
  }

  footer.app-footer a:hover, footer.app-footer a:focus {
    text-decoration: underline;
  }

  @media (min-width: 640px) {
    .latin-text { font-size: 40px; }
    .today-card { padding: 34px 30px; }
  }
</style>
</head>

<div class="app-shell">

  var FAV_KEY = "latinPhrase116_favorites";
  var STATE_KEY = "latinPhrase116_lastState";

  function safeGet(key) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* ignore storage failures, app still works in-memory */
    }
  }

  var favorites = safeGet(FAV_KEY) || [];
  var lastState = safeGet(STATE_KEY) || { activeView: "today", archiveFilter: "all", archiveOffset: 0 };

  function dayOfYear(date) {
    var start = new Date(date.getFullYear(), 0, 0);
    var diff = date - start;
    var oneDay = 1000 * 60 * 60 * 24;
    return Math.floor(diff / oneDay);
  }

  function getPhraseForOffset(offset) {
    var today = new Date();
    var base = dayOfYear(today);
    var index = ((base + offset) % PHRASES.length + PHRASES.length) % PHRASES.length;
    return PHRASES[index];
  }

  function isFavorite(id) {
    return favorites.indexOf(id) !== -1;
  }

  function toggleFavorite(id) {
    var pos = favorites.indexOf(id);
    if (pos === -1) {
      favorites.push(id);
    } else {
      favorites.splice(pos, 1);
    }
    safeSet(FAV_KEY, favorites);
  }

  function catLabel(cat) {
    var labels = {
      liturgy: "Liturgy",
      law: "Law",
      philosophy: "Philosophy",
      motto: "Motto"
    };
    return labels[cat] || cat;
  }

  function formatToday() {
    var d = new Date();
    var options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
    return d.toLocaleDateString(undefined, options);
  }

  function renderToday() {
    var phrase = getPhraseForOffset(0);
    var card = document.getElementById("today-card");
    var favActive = isFavorite(phrase.id) ? "active" : "";
    var starChar = isFavorite(phrase.id) ? String.fromCharCode(9733) : String.fromCharCode(9734);

    card.innerHTML =
      '<div class="today-date">' + formatToday() + '</div>' +
      '<span class="cat-pill cat-' + phrase.category + '">' + catLabel(phrase.category) + '</span>' +
      '<p class="latin-text">' + phrase.latin + '</p>' +
      '<p class="translation-text">' + phrase.translation + '</p>' +
      '<p class="pronunciation-row"><span class="label">Pronunciation:</span>' + phrase.pronunciation + '</p>' +
      '<p class="usage-text">' + phrase.usage + '</p>' +
      '<div class="card-footer-row">' +
        '<button type="button" class="fav-btn ' + favActive + '" id="fav-toggle-btn">' +
          '<span class="star">' + starChar + '</span>' +
          '<span>' + (isFavorite(phrase.id) ? "Favorited" : "Favorite") + '</span>' +
        '</button>' +
      '</div>';

    document.getElementById("fav-toggle-btn").addEventListener("click", function () {
      toggleFavorite(phrase.id);
      renderToday();
    });
  }

  var CATEGORIES = ["all", "liturgy", "law", "philosophy", "motto"];

  function renderFilterRow() {
    var row = document.getElementById("filter-row");
    row.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "filter-chip" + (lastState.archiveFilter === cat ? " active" : "");
      chip.textContent = cat === "all" ? "All" : catLabel(cat);
      chip.addEventListener("click", function () {
        lastState.archiveFilter = cat;
        lastState.archiveOffset = 0;
        safeSet(STATE_KEY, lastState);
        renderFilterRow();
        renderArchive();
      });
      row.appendChild(chip);
    });
  }

  var openEntryId = null;

  function renderArchive() {
    var offset = lastState.archiveOffset;
    var phrase = getPhraseForOffset(offset);
    var filter = lastState.archiveFilter;

    var list = document.getElementById("archive-list");
    var label = document.getElementById("page-label");

    if (filter !== "all" && phrase.category !== filter) {
      list.innerHTML = '<div class="empty-note">No phrase in this category for this day. Use the arrows to browse to a matching day.</div>';
      label.textContent = offset === 0 ? "Today" : (offset > 0 ? "+" + offset + " days" : offset + " days");
      return;
    }

    label.textContent = offset === 0 ? "Today" : (offset > 0 ? "+" + offset + " days" : offset + " days");

    var isOpen = openEntryId === phrase.id;
    var entry = document.createElement("div");
    entry.className = "archive-entry" + (isOpen ? " open" : "");

    entry.innerHTML =
      '<button type="button" class="archive-entry-head" id="archive-head-btn">' +
        '<span>' +
          '<span class="cat-pill cat-' + phrase.category + '">' + catLabel(phrase.category) + '</span><br>' +
          '<span class="latin-small">' + phrase.latin + '</span>' +
        '</span>' +
        '<span class="chev">&#9660;</span>' +
      '</button>' +
      '<div class="archive-entry-body">' +
        '<p class="translation-text">' + phrase.translation + '</p>' +
        '<p class="pronunciation-row"><span class="label">Pronunciation:</span>' + phrase.pronunciation + '</p>' +
        '<p class="usage-text">' + phrase.usage + '</p>' +
      '</div>';

    list.innerHTML = "";
    list.appendChild(entry);

    document.getElementById("archive-head-btn").addEventListener("click", function () {
      openEntryId = isOpen ? null : phrase.id;
      renderArchive();
    });
  }

  function pageArchive(direction) {
    lastState.archiveOffset = lastState.archiveOffset + direction;
    openEntryId = null;
    safeSet(STATE_KEY, lastState);
    renderArchive();
  }
  window.pageArchive = pageArchive;

  function switchView(view) {
    lastState.activeView = view;
    safeSet(STATE_KEY, lastState);

    document.getElementById("view-today").classList.toggle("active", view === "today");
    document.getElementById("view-archive").classList.toggle("active", view === "archive");
    document.getElementById("tab-today").classList.toggle("active", view === "today");
    document.getElementById("tab-archive").classList.toggle("active", view === "archive");
  }
  window.switchView = switchView;

  function init() {
    renderToday();
    renderFilterRow();
    renderArchive();
    switchView(lastState.activeView === "archive" ? "archive" : "today");
  }

  init();
})();
